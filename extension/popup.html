<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shopify Store Inspector</title>
  <link rel="stylesheet" href="report.css">
  <style>
    html, body { margin: 0; }
    body { width: 420px; min-height: 200px; background: var(--s-bg); }
    .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #6d28d9; color: #fff; }
    .top b { font-size: 14px; flex: 1; }
    .top a { color: #fff; opacity: .85; font-size: 12px; }
    form { display: flex; gap: 6px; padding: 10px 12px 0; }
    form input { flex: 1; min-width: 0; border: 1px solid var(--s-line); border-radius: 8px; padding: 7px 10px; font: inherit; background: var(--s-panel); color: var(--s-text); }
    form .btn { padding: 7px 12px; }
    #out { padding: 10px 12px 12px; }
    .credit { text-align: center; font-size: 11.5px; color: var(--s-muted); padding: 0 12px 12px; }
    .credit a { color: var(--s-accent); }
  </style>
</head>
<body class="ssi">
  <div class="top"><span>🔎</span><b>Shopify Store Inspector</b><a id="site" href="#" target="_blank" rel="noopener">Guide</a></div>
  <form id="form"><input id="url" placeholder="Inspect another store, e.g. kith.com" aria-label="Store address"><button class="btn" type="submit">Go</button></form>
  <div id="out"></div>
  <div class="credit">Made by Syeda Umaima · <a href="https://www.fiverr.com/umaima886" target="_blank" rel="noopener">Hire me on Fiverr</a></div>
  <script src="config.js"></script>
  <script src="report.js"></script>
  <script src="popup.js"></script>
</body>
</html>
